# Builds a static preview of the site and publishes it to GitHub Pages.
# The preview is noindex, has no server (no enquiry API or AI advisor step), and
# sends booking/checkout to the live sixsigma.co.uk platform. Production runs the
# full Node build instead (see sixsigma-web/README.md).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild with freshly scraped course dates and prices.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sixsigma-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Refresh dates, prices and content from the live site. The scraper aborts
      # (failing this run and keeping the last deployment) if the scrape looks partial.
      - name: Refresh course data
        working-directory: .
        run: |
          pip install --quiet requests beautifulsoup4 lxml
          python -I tools/scrape_site.py --refresh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sixsigma-web/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static export
        run: |
          # Route handlers that need a server cannot be part of a static export.
          rm -rf src/app/api
          npx next build
          node scripts/preview-redirects.mjs
          touch out/.nojekyll
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_PREVIEW: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sixsigma-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
